version: 0.1.4
author: rjayroach
# The command-line tools (bat, fzf, ...) and their config come from pde/cli, shared with pde/bash
depends: [cli]
# zsh itself comes from the distro so the login shell is a path listed in /etc/shells
system:
  linux: [zsh]
  # minimal Fedora images lack hostname, which p10k.zsh's custom_context segment runs
  fedora: [zsh, hostname]
